# render.yaml — One-click deployment config for Render
# Docs: https://render.com/docs/blueprint-spec
#
# This file defines all 3 services needed for AI-Kumbh-DSS:
#   1. PostgreSQL database
#   2. FastAPI backend (Python web service)
#   3. React/Vite frontend (static site)

databases:
  - name: kumbh-db
    databaseName: kumbh_ai
    user: kumbh_user
    plan: free

services:
  # ── 1. FastAPI Backend ──────────────────────────────────────────
  - type: web
    name: kumbh-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kumbh-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false          # You will paste this manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── 2. React/Vite Frontend ──────────────────────────────────────
  - type: web
    name: kumbh-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: kumbh-backend
          type: web
          property: hostWithScheme
    routes:
      # Send all routes to index.html for React Router (SPA routing)
      - type: rewrite
        source: /*
        destination: /index.html
